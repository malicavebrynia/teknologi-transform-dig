<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Nusantara</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #1b4332;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .btn {
            background: #d4a373;
            color: white;
            border: none;
            padding: 14px 20px;
            margin: 8px 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .question-box {
            background: #f8f9fa;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .opt-btn {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 12px;
            margin: 6px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }
        .opt-btn.correct { background: #52b788 !important; color: white; border-color: #2d6a4f; }
        .opt-btn.wrong { background: #e07a5f !important; color: white; border-color: #bc6c25; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Halaman Utama -->
        <div id="home-screen">
            <h1>🌿 PETUALANGAN NUSANTARA</h1>
            <p class="subtitle">Mengenal Keberagaman Budaya 38 Provinsi</p>
            <button class="btn" onclick="MulaiGame()">🚀 Mulai Bermain</button>
        </div>

        <!-- Halaman Kuis -->
        <div id="game-screen" class="hidden">
            <div id="info-progres" style="font-size: 12px; color: #666; margin-bottom: 8px;">Soal 1 dari 5</div>
            <div class="question-box" id="teks-soal">Memuat soal...</div>
            <div id="pilihan-box"></div>
            <button class="btn hidden" id="lanjut-btn" onclick="SoalBerikutnya()" style="margin-top: 15px; background: #2d6a4f;">Lanjut ➔</button>
        </div>

        <!-- Halaman Selesai -->
        <div id="end-screen" class="hidden">
            <h2>🎉 Selesai!</h2>
            <p style="font-size: 16px; margin: 15px 0;">Skor Kamu: <strong id="skor-akhir" style="color: #d4a373;">0</strong></p>
            <button class="btn" onclick="MulaiGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        const databaseSoal = [
            { q: "Apa nama rumah panggung tradisional khas suku Aceh?", opts: ["Rumoh Aceh", "Rumah Gadang", "Nuwou Sesat", "Joglo"], ans: 0 },
            { q: "Kain tenun tradisional kebanggaan masyarakat Batak dinamakan...", opts: ["Ulos", "Songket", "Sasirangan", "Batik"], ans: 0 },
            { q: "Tarian tradisional Minangkabau yang menggunakan piring adalah...", opts: ["Tari Piring", "Tari Saman", "Tari Tor-Tor", "Tari Pendet"], ans: 0 },
            { q: "Alat musik bambu tradisional dari Jawa Barat yang digoyangkan adalah...", opts: ["Angklung", "Gamelan", "Calung", "Rebab"], ans: 0 },
            { q: "Makanan pokok tradisional Papua dari olahan sari pati sagu adalah...", opts: ["Papeda", "Nasi Uduk", "Gudeg", "Pempek"], ans: 0 }
        ];

        let indexSoal = 0;
        let skor = 0;

        function MulaiGame() {
            document.getElementById("home-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            indexSoal = 0;
            skor = 0;
            TampilkanSoal();
        }

        function TampilkanSoal() {
            document.getElementById("lanjut-btn").classList.add("hidden");
            let data = databaseSoal[indexSoal];
            document.getElementById("info-progres").innerText = `Soal ${indexSoal + 1} dari ${databaseSoal.length}`;
            document.getElementById("teks-soal").innerText = data.q;

            let box = document.getElementById("pilihan-box");
            box.innerHTML = "";

            data.opts.forEach((opt, idx) => {
                let b = document.createElement("button");
                b.className = "opt-btn";
                b.innerText = opt;
                b.onclick = function() { Jawab(idx, data.ans); };
                box.appendChild(b);
            });
        }

        function Jawab(pilihan, benar) {
            let semuaTombol = document.querySelectorAll(".opt-btn");
            semuaTombol.forEach(btn => btn.disabled = true);

            if (pilihan === benar) {
                semuaTombol[pilihan].classList.add("correct");
                skor += 20;
            } else {
                semuaTombol[pilihan].classList.add("wrong");
                semuaTombol[benar].classList.add("correct");
            }

            if (indexSoal < databaseSoal.length - 1) {
                document.getElementById("lanjut-btn").classList.remove("hidden");
            } else {
                setTimeout(() => {
                    document.getElementById("game-screen").classList.add("hidden");
                    document.getElementById("end-screen").classList.remove("hidden");
                    document.getElementById("skor-akhir").innerText = skor;
                }, 1000);
            }
        }

        function SoalBerikutnya() {
            indexSoal++;
            TampilkanSoal();
        }
    </script>
</body>
  </html>
